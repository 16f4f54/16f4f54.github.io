<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OtoMoto → Autoplac{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #16213e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header .badge { font-size: 0.7rem; background: #e94560; padding: 0.2rem 0.5rem; border-radius: 4px; }

    .container { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 1.2rem; color: #16213e; }

    .alert {
      padding: 0.8rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-error { background: #ffeaea; color: #c0392b; border-left: 4px solid #e74c3c; }
    .alert-info  { background: #eaf4ff; color: #1565c0; border-left: 4px solid #2196f3; }

    label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 0.3rem; }

    input[type=text], input[type=email], input[type=password], input[type=url],
    select, textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fafafa;
      transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #e94560; background: #fff;
    }

    .field-group { margin-bottom: 1rem; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .2s, transform .1s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #eee; color: #333; }

    .step-bar { display: flex; gap: 0; margin-bottom: 2rem; }
    .step {
      flex: 1; text-align: center; padding: 0.6rem;
      font-size: 0.8rem; font-weight: 600;
      background: #eee; color: #999;
    }
    .step.active { background: #e94560; color: #fff; }
    .step.done   { background: #27ae60; color: #fff; }
    .step:first-child { border-radius: 8px 0 0 8px; }
    .step:last-child  { border-radius: 0 8px 8px 0; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>OtoMoto → Autoplac.pl</h1>
    <span class="badge">komis</span>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
